apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joplin-backup
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: backup
    project: infra
spec:
  project: infra

  # Source: Where the manifests are stored
  source:
    repoURL: https://github.com/Ling-Ling23/k3s_homelab_with_nas.git
    targetRevision: main
    path: k3s/argocd/projects/infra/joplin-backup

  # Destination: Where to deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: joplin-backup

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
