# ResourceQuota and LimitRange for trilium namespace
# Sized for 1 lightweight notes pod.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: trilium-quota
  namespace: trilium
spec:
  hard:
    pods: "5"
    requests.cpu: "200m"
    requests.memory: "256Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    persistentvolumeclaims: "3"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: trilium-limits
  namespace: trilium
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
