# ResourceQuota and LimitRange for dashy namespace
# Sized for a single dashboard pod; limits.memory is generous because
# Dashy can spike to ~2Gi on initial render.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dashy-quota
  namespace: dashy
spec:
  hard:
    pods: "5"
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "3"
    limits.memory: "4Gi"
    persistentvolumeclaims: "3"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dashy-limits
  namespace: dashy
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
