# ResourceQuota and LimitRange for logging namespace
# Loki runs as a single pod; promtail runs as a DaemonSet (1 pod per node).
# Pods limit accounts for 1 loki + up to 10 promtail pods (node count headroom).
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: logging-quota
  namespace: logging
spec:
  hard:
    pods: "20"
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    persistentvolumeclaims: "5"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: logging-limits
  namespace: logging
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
