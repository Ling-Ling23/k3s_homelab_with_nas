# ResourceQuota and LimitRange for github-runner namespace
# Prevents the CI runner from consuming excessive cluster resources.
# Sized for 1 active runner pod; increase pods/limits if running parallel jobs.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: github-runner-quota
  namespace: github-runner
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    persistentvolumeclaims: "3"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: github-runner-limits
  namespace: github-runner
spec:
  limits:
    - type: Container
      default:          # applied when container omits limits
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:   # applied when container omits requests
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
