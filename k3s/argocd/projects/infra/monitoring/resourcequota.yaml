# ResourceQuota and LimitRange for monitoring namespace
# kube-prometheus-stack deploys: prometheus, grafana, alertmanager,
# node-exporter (DaemonSet), kube-state-metrics + various init containers.
# Quota is intentionally generous; LimitRange max is high to avoid blocking
# Prometheus, which can spike well above 1Gi on large scrapers.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    pods: "30"
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "8"
    limits.memory: "12Gi"
    persistentvolumeclaims: "10"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4"
        memory: "8Gi"   # Prometheus can hold multiple GBs of TSDB in-memory
      min:
        cpu: "10m"
        memory: "32Mi"
